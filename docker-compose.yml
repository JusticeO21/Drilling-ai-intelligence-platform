version: '3.8'

networks:
  app-network:
    driver: bridge
    name: oil-drilling-network

volumes:
  chroma_data:
  redis_data:
  ollama_data:

services:
  # API Service
  api:
    build:
      context: .
      dockerfile: backend/services/api/Dockerfile
    container_name: oil-drilling-api
    env_file: 
      - .env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - CHROMA_HOST=chroma
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/static
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started 
      # ollama:
      #   condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oil-drilling-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_BASE_PATH=
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - app-network

  # Vector Database (No Auth)
  chroma:
    image: chromadb/chroma:latest
    container_name: oil-drilling-chroma
    environment:
      - ALLOW_RESET=TRUE
      - IS_PERSISTENT=TRUE
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app-network

  # Cache & Session Store (No Password)
  redis:
    image: redis:7-alpine
    container_name: oil-drilling-redis
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultPassword123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: oil-drilling-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"] 
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
