version: '3.8'

# Define reusable network
networks:
  app-network:
    driver: bridge
    name: oil-drilling-network

# Define volumes
volumes:
  chroma_data:
  redis_data:

services:
  # API Service
  api:
    build:
      context: ./backend/services/api  # Changed: relative to compose file location
      dockerfile: Dockerfile
    container_name: oil-drilling-api
    env_file: 
      - ./.env  # Changed: .env is at the same level
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - CHROMA_HOST=chroma
    ports:
      - "8000:8000"
    # Remove volume mounts for production - code should be in the image
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Frontend Service
  frontend:
    build:
      context: ./frontend  # Changed: relative to compose file location
      dockerfile: Dockerfile
    container_name: oil-drilling-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_BASE_PATH=
    ports:
      - "3000:3000"
    # Remove volume mounts for production
    depends_on:
      - api
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: oil-drilling-chroma
    environment:
      - ALLOW_RESET=FALSE
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_USERNAME}:${CHROMA_AUTH_PASSWORD}
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.basic_chromadb.auth.basic_auth.BasicAuthServerProvider
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: oil-drilling-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5z
