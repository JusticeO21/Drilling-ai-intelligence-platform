version: '3.8'

services:
  # API Service - Development overrides
  api:
    environment:
      - DEBUG=true
      - DATABASE_URL=sqlite:///./dev.db
    volumes:
      - .:/app
      - /app/__pycache__
    command: ["uvicorn", "services.api.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]

  # AI Service - Development overrides
  ai:
    volumes:
      - .:/app
      - /app/__pycache__
    profiles: []  # Enable by default in development

  # Ollama - Development settings
  ollama:
    ports:
      - "11434:11434"
    # volumes:
    #   - ./ollama-models:/root/.ollama

  db:
    profiles: []  # Enable by default in development
    environment:
      POSTGRES_PASSWORD: dev_password
